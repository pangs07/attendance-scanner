<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Attendance Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align:center;
            padding:20px;
            margin:0;
        }

        h2{
            margin-bottom:10px;
        }

        #reader{
            width:100%;
            max-width:500px;
            margin:auto;
        }

        #result{
            margin-top:20px;
            font-size:22px;
            font-weight:bold;
            min-height:40px;
        }

        .success{
            color:green;
        }

        .error{
            color:red;
        }

        .info{
            color:blue;
        }

    </style>
</head>

<body>

<h2>Attendance Scanner</h2>

<div id="reader"></div>

<div id="result"></div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyWWMrtRacvUrQ_vHQaxtxI6BoJkT4HTfFtClIBb1pELtPpUyPzYwNmNOEvXVO1DdzlDw/exec";

/* Scanner Identification */

let scannerName = localStorage.getItem("scanner");

if(!scannerName){

    scannerName = prompt(
        "Enter Scanner Name (Example: Scanner1)"
    );

    if(!scannerName){
        scannerName = "Unknown";
    }

    localStorage.setItem(
        "scanner",
        scannerName
    );
}

/* QR Processing */

let lastScan = "";
let processing = false;

function onScanSuccess(decodedText){

    if(processing){
        return;
    }

    if(decodedText === lastScan){
        return;
    }

    processing = true;
    lastScan = decodedText;

    document.getElementById("result").className = "info";

    document.getElementById("result").innerHTML =
        "Sending Attendance...<br>" +
        decodedText;

    fetch(APPS_SCRIPT_URL,{

        method:"POST",

        body:JSON.stringify({

            sn:decodedText,
            scanner:scannerName

        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("result").className =
            "success";

        document.getElementById("result").innerHTML =
            "✓ RECORDED<br>" +
            decodedText;

        setTimeout(() => {

            processing = false;
            lastScan = "";

            document.getElementById("result").innerHTML =
                "";

        },2000);

    })

    .catch(error => {

        console.error(error);

        document.getElementById("result").className =
            "error";

        document.getElementById("result").innerHTML =
            "✗ ERROR SENDING ATTENDANCE";

        setTimeout(() => {

            processing = false;
            lastScan = "";

            document.getElementById("result").innerHTML =
                "";

        },2000);

    });
}

/* Camera Initialization */

const html5QrCode =
    new Html5Qrcode("reader");

html5QrCode.start(

    {
        facingMode: "environment"
    },

    {
        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        },

        aspectRatio: 1.0
    },

    onScanSuccess

)

.catch(err => {

    console.error(err);

    document.getElementById("result").className =
        "error";

    document.getElementById("result").innerHTML =
        "Unable to access camera";

});

</script>

</body>
</html>
