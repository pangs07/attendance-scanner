<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h2{
    font-size: 36px;
}

#reader{
    width: 100%;
    max-width: 500px;
    margin: auto;
}

#result{
    margin-top: 20px;
    font-size: 48px;
    font-weight: bold;
    min-height: 100px;
}

.success{
    color: green;
}

.error{
    color: red;
}

.info{
    color: blue;
}

button{
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
}

</style>

</head>

<body>

<h2>Attendance Scanner</h2>

<div id="reader"></div>

<div id="result"></div>

<button onclick="resetScanner()">
Change Scanner
</button>

<script>

/* ===================================
   CONFIGURATION
=================================== */

const APPS_SCRIPT_URL =
"url_to_be_entered_by_user";

/* ===================================
   SUCCESS BEEP
=================================== */

const successBeep =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

/* ===================================
   SCANNER NAME
=================================== */

let scannerName =
localStorage.getItem(
    "scannerName"
);

if(!scannerName){

    scannerName =
    prompt(
      "Enter Scanner Name (e.g. Scanner1)"
    );

    if(!scannerName){

        scannerName =
        "Unknown";

    }

    localStorage.setItem(
      "scannerName",
      scannerName
    );
}

/* ===================================
   SCANNER TOKEN
=================================== */

let scannerToken =
localStorage.getItem(
    "scannerToken"
);

let activated =
scannerToken ? true : false;

/* ===================================
   STATE VARIABLES
=================================== */

let processing = false;
let lastScan = "";

/* ===================================
   HELPER FUNCTIONS
=================================== */

function showMessage(
    text,
    css
){

    const result =
    document.getElementById(
        "result"
    );

    result.className = css;
    result.innerHTML = text;
}

function resetScanner(){

    localStorage.removeItem(
      "scannerToken"
    );

    localStorage.removeItem(
      "scannerName"
    );

    location.reload();
}

/* ===================================
   QR SUCCESS HANDLER
=================================== */

function onScanSuccess(
    decodedText
){

    if(processing){
        return;
    }

    if(decodedText === lastScan){
        return;
    }

    lastScan = decodedText;

    /*
      FIRST SCAN:
      OPERATOR QR
    */

    if(!activated){

        scannerToken =
        decodedText;

        localStorage.setItem(
          "scannerToken",
          scannerToken
        );

        activated = true;

        showMessage(
          "✓ Scanner Activated",
          "success"
        );

        setTimeout(() => {

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

            lastScan = "";

        },2500);

        return;
    }

    /*
      PREVENT OPERATOR QR
      FROM BEING LOGGED
    */

    if(
        String(decodedText)
          .toUpperCase()
          .startsWith("SCN")
    ){

        showMessage(
          "Operator QR Detected",
          "error"
        );

        setTimeout(() => {

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

            lastScan = "";

        },2000);

        return;
    }

    /*
      ATTENDANCE SCAN
    */

    processing = true;

    showMessage(
  "⏳ SENDING<br>" +
  decodedText,
  "info"
);

    fetch(
      APPS_SCRIPT_URL,
      {

        method:"POST",

        body:JSON.stringify({

            sn:decodedText,

            scanner:
            scannerName,

            token:
            scannerToken

        })

      }
    )

    .then(
      response =>
      response.json()
    )

    .then(data => {

        if(
          data.status ===
          "unauthorized"
        ){

            showMessage(
              "Invalid Scanner",
              "error"
            );

            processing = false;
            lastScan = "";

            return;
        }

        if(
          data.status ===
          "invalid_attendance"
        ){

            showMessage(
              "Operator QR Cannot Be Logged",
              "error"
            );

            processing = false;
            lastScan = "";

            return;
        }

        if(
          data.status ===
          "invalid_request"
        ){

            showMessage(
              "Invalid Request",
              "error"
            );

            processing = false;
            lastScan = "";

            return;
        }

        if(
          data.status ===
          "server_error"
        ){

            showMessage(
              "Server Error",
              "error"
            );

            processing = false;
            lastScan = "";

            return;
        }

        if(
  data.status ===
  "success"
){

    successBeep.play();

    showMessage(
      "✓ RECORDED<br>" +
      decodedText,
      "success"
    );

    /*
      Immediately ready for next scan.
      Keep last successful scan visible
      until another scan occurs.
    */

    processing = false;
    lastScan = "";

}

    })

    .catch(error => {

        console.error(error);

        showMessage(
          "ERROR",
          "error"
        );

        setTimeout(() => {

            processing = false;
            lastScan = "";

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

        },3000);

    });

}

/* ===================================
   CAMERA START
=================================== */

const html5QrCode =
new Html5Qrcode(
    "reader"
);

html5QrCode.start(

    {
      facingMode:
      "environment"
    },

    {
      fps: 10,

      qrbox: {
          width: 250,
          height: 250
      }
    },

    onScanSuccess

)

.catch(err => {

    console.error(err);

    showMessage(
      "Camera Error",
      "error"
    );

});

</script>

</body>

</html>
