<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Attendance Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

#reader{
    width:100%;
    max-width:500px;
    margin:auto;
}

#result{
    margin-top:20px;
    font-size:48px;
    font-weight:bold;
    min-height:100px;
}

.success{
    color:green;
}

.error{
    color:red;
}

.info{
    color:blue;
}

button{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
}

</style>

</head>

<body>

<h2>Attendance Scanner</h2>

<div id="reader"></div>

<div id="result"></div>

<button onclick="resetScanner()">
Change Scanner
</button>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyWWMrtRacvUrQ_vHQaxtxI6BoJkT4HTfFtClIBb1pELtPpUyPzYwNmNOEvXVO1DdzlDw/exec";

let scannerName =
localStorage.getItem("scannerName");

if(!scannerName){

    scannerName =
    prompt(
      "Enter Scanner Name (Scanner1)"
    );

    localStorage.setItem(
      "scannerName",
      scannerName
    );
}

let scannerToken =
localStorage.getItem(
    "scannerToken"
);

let activated =
scannerToken ? true : false;

let processing = false;

let lastScan = "";

function showMessage(
    text,
    css
){

    document
      .getElementById("result")
      .className = css;

    document
      .getElementById("result")
      .innerHTML = text;
}

function resetScanner(){

    localStorage.removeItem(
      "scannerToken"
    );

    location.reload();
}

function onScanSuccess(
    decodedText
){

    if(processing){
        return;
    }

    if(decodedText === lastScan){
        return;
    }

    lastScan = decodedText;

    /*
     FIRST SCAN:
     OPERATOR QR
    */

    if(!activated){

        scannerToken =
            decodedText;

        localStorage.setItem(
            "scannerToken",
            scannerToken
        );

        activated = true;

        showMessage(
          "✓ Scanner Activated",
          "success"
        );

        setTimeout(() => {

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

        },1000);

        return;
    }

    /*
      ATTENDANCE SCAN
    */

    processing = true;

    showMessage(
      "Sending...",
      "info"
    );

    fetch(
      APPS_SCRIPT_URL,
      {

        method:"POST",

        body:JSON.stringify({

            sn:decodedText,

            scanner:
            scannerName,

            token:
            scannerToken

        })

      }
    )

    .then(
      response =>
      response.json()
    )

    .then(data => {

        if(
          data.status ===
          "unauthorized"
        ){

            showMessage(
              "Invalid Scanner",
              "error"
            );

            processing =
            false;

            return;
        }

        showMessage(
          "✓ RECORDED<br>" +
          decodedText,
          "success"
        );

        setTimeout(() => {

            processing =
            false;

            lastScan = "";

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

        },500);

    })

    .catch(error => {

        console.error(
          error
        );

        showMessage(
          "ERROR",
          "error"
        );

        setTimeout(() => {

            processing =
            false;

            lastScan = "";

            document
              .getElementById(
                "result"
              )
              .innerHTML = "";

        },1000);

    });

}

const html5QrCode =
new Html5Qrcode(
    "reader"
);

html5QrCode.start(

    {
      facingMode:
      "environment"
    },

    {
      fps:10,

      qrbox:{
          width:250,
          height:250
      }
    },

    onScanSuccess

).catch(err => {

    console.error(err);

    showMessage(
      "Camera Error",
      "error"
    );

});

</script>

</body>

</html>
